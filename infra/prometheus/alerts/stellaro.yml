groups:
  - name: stellaro_alerts
    interval: 30s
    rules:
      # Backend Health
      - alert: BackendDown
        expr: up{job="stellaro-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Stellaro Backend is down"
          description: "Backend has been down for more than 1 minute"

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over 5 minutes"

      # High Response Time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "95th percentile response time is {{ $value }}s"

      # Database Connection Pool
      - alert: DatabasePoolExhausted
        expr: pg_stat_activity_count > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "{{ $value }} active connections"

      # Redis Memory
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"

      # Disk Space
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"

      # API Rate Limiting
      - alert: HighAPIRateLimit
        expr: rate(stellaro_rate_limit_exceeded_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High rate of API rate limiting"
          description: "{{ $value }} requests/s being rate limited"

      # Smart Contract Failures
      - alert: ContractExecutionFailures
        expr: rate(soroban_contract_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High smart contract failure rate"
          description: "{{ $value }} contract failures/s"

      # ZK Proof Verification Failures
      - alert: ZKProofFailures
        expr: rate(zk_proof_verification_failures_total[10m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ZK proof verification failures detected"
          description: "{{ $value }} proof failures/s"
