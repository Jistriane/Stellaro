---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stellaro-backend-config
  namespace: production
data:
  app.json: |
    {
      "service": "stellaro-backend",
      "version": "3.0.0",
      "features": {
        "passkey": true,
        "zkCredit": true,
        "pixIntegration": true,
        "reflectorOracle": true
      },
      "limits": {
        "maxRequestsPerMinute": 1000,
        "maxConcurrentConnections": 500
      }
    }

---
# NetworkPolicy para segurança
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stellaro-backend-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: stellaro-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: production
    ports:
    - protocol: TCP
      port: 3001
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 443   # External APIs
