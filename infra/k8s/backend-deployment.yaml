# Stellaro Backend - Kubernetes Deployment
# Target: AWS EKS (sa-east-1)
# Production-ready with HPA, health checks, and resource limits

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellaro-backend
  namespace: production
  labels:
    app: stellaro-backend
    version: v3.0
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: stellaro-backend
  template:
    metadata:
      labels:
        app: stellaro-backend
        version: v3.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: stellaro-backend-sa
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: api
        image: stellaro/backend:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 3001
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: STELLAR_NETWORK
          value: "mainnet"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: stellaro-secrets
              key: database-url
        - name: STELLAR_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stellaro-secrets
              key: stellar-secret-key
        - name: STELLAR_HORIZON
          value: "https://horizon.stellar.org"
        - name: SOROBAN_RPC_URL
          value: "https://soroban-rpc.stellar.org"
        - name: REFLECTOR_URL
          value: "https://api.reflector.network"
        - name: REDIS_URL
          value: "redis://stellaro-redis:6379"

        # Smart Contracts
        - name: STABLECOIN_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: stablecoin-id } }
        - name: RISKLOCK_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: risklock-id } }
        - name: LOANSPOOL_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: loanspool-id } }
        - name: PORTFOLIO_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: portfolio-id } }
        - name: GOVERNANCE_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: governance-id } }
        - name: ZK_VERIFIER_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: zk-verifier-id } }
        - name: BATCH_EXECUTOR_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: batch-executor-id } }
        - name: MEV_GUARD_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: mev-guard-id } }

        # PIX Integration
        - name: PIX_MODE
          value: "production"
        - name: PIX_API_URL
          valueFrom: { configMapKeyRef: { name: stellaro-backend-config, key: pix-api-url } }
        - name: PIX_API_KEY
          valueFrom: { secretKeyRef: { name: stellaro-secrets, key: pix-api-key } }
        - name: PIX_WEBHOOK_SECRET
          valueFrom: { secretKeyRef: { name: stellaro-secrets, key: pix-webhook-secret } }

        # Card Integration
        - name: CARD_API_URL
          valueFrom: { configMapKeyRef: { name: stellaro-backend-config, key: card-api-url } }
        - name: CARD_API_KEY
          valueFrom: { secretKeyRef: { name: stellaro-secrets, key: card-api-key } }

        # Compliance (Sumsub)
        - name: SUMSUB_BASE_URL
          value: "https://api.sumsub.com"
        - name: SUMSUB_APP_TOKEN
          valueFrom: { secretKeyRef: { name: stellaro-secrets, key: sumsub-app-token } }
        - name: SUMSUB_SECRET_KEY
          valueFrom: { secretKeyRef: { name: stellaro-secrets, key: sumsub-secret-key } }
        
        # Resource limits (production-grade)
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Startup probe (para boot lento)
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 30
        
        # Volume mounts
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      
      volumes:
      - name: config
        configMap:
          name: stellaro-backend-config

---
apiVersion: v1
kind: Service
metadata:
  name: stellaro-backend-service
  namespace: production
  labels:
    app: stellaro-backend
spec:
  type: LoadBalancer
  selector:
    app: stellaro-backend
  ports:
  - name: http
    protocol: TCP
    port: 443
    targetPort: 3001
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: 9090
  sessionAffinity: ClientIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stellaro-backend-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stellaro-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellaro-backend-sa
  namespace: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/StellaroBackendRole

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stellaro-backend-config
  namespace: production
data:
  app.json: |
    {
      "service": "stellaro-backend",
      "version": "3.0.0",
      "features": {
        "passkey": true,
        "zkCredit": true,
        "pixIntegration": true,
        "reflectorOracle": true
      },
      "limits": {
        "maxRequestsPerMinute": 1000,
        "maxConcurrentConnections": 500
      }
    }

---
# NetworkPolicy para segurança
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stellaro-backend-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: stellaro-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: production
    ports:
    - protocol: TCP
      port: 3001
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 443   # External APIs
