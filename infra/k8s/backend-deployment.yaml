# Stellaro Backend - Kubernetes Deployment
# Target: AWS EKS (sa-east-1)
# Production-ready with HPA, health checks, and resource limits

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellaro-backend
  namespace: production
  labels:
    app: stellaro-backend
    version: v3.0
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: stellaro-backend
  template:
    metadata:
      labels:
        app: stellaro-backend
        version: v3.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: stellaro-backend-sa
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: api
        image: stellaro/backend:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 3001
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: STELLAR_NETWORK
          value: "mainnet"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: stellaro-secrets
              key: database-url
        - name: STELLAR_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stellaro-secrets
              key: stellar-secret-key
        - name: STELLAR_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: stellaro-secrets
              key: stellar-public-key
              optional: true
        - name: STELLAR_HORIZON
          value: "https://horizon.stellar.org"
        - name: SOROBAN_RPC_URL
          value: "https://rpc.ankr.com/stellar_soroban"
        - name: STELLAR_NETWORK_PASSPHRASE
          value: "Public Global Stellar Network ; September 2015"
        - name: REFLECTOR_URL
          value: "https://api.reflector.network"
        - name: REDIS_URL
          value: "redis://stellaro-redis:6379"

        # Smart Contracts
        - name: STABLECOIN_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: stablecoin-id } }
        - name: RISKLOCK_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: risklock-id } }
        - name: LOANSPOOL_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: loanspool-id } }
        - name: PORTFOLIO_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: portfolio-id } }
        - name: GOVERNANCE_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: governance-id } }
        - name: ZK_VERIFIER_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: zk-verifier-id } }
        - name: BATCH_EXECUTOR_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: batch-executor-id } }
        - name: MEV_GUARD_CONTRACT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: mev-guard-id } }
        - name: VC_REGISTRY_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: vc-registry-id } }
        - name: RWA_TOKENIZER_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: rwa-tokenizer-id } }
        - name: DAO_GOVERNANCE_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: dao-governance-id } }
        - name: RECURRING_PAYMENTS_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: recurring-payments-id } }
        - name: INSURANCE_POOL_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: insurance-pool-id } }
        - name: BRIDGE_ADAPTER_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: bridge-adapter-id } }
        - name: RWA_MARKETPLACE_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: rwa-marketplace-id } }
        - name: INSTITUTIONAL_VAULT_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: institutional-vault-id } }
        - name: LIQUID_STAKING_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: liquid-staking-id } }
        - name: MULTISIG_ADAPTER_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: multisig-adapter-id } }
        - name: REFERRAL_SYSTEM_ID
          valueFrom: { configMapKeyRef: { name: stellaro-contracts, key: referral-system-id } }

        # PIX Integration
        - name: PIX_MODE
          value: "production"
        - name: PIX_API_URL
          valueFrom: { configMapKeyRef: { name: stellaro-backend-config, key: pix-api-url } }
        - name: PIX_API_KEY
          valueFrom: { secretKeyRef: { name: stellaro-secrets, key: pix-api-key } }
        - name: PIX_WEBHOOK_SECRET
          valueFrom: { secretKeyRef: { name: stellaro-secrets, key: pix-webhook-secret } }

        # Card Integration
        - name: CARD_API_URL
          valueFrom: { configMapKeyRef: { name: stellaro-backend-config, key: card-api-url } }
        - name: CARD_API_KEY
          valueFrom: { secretKeyRef: { name: stellaro-secrets, key: card-api-key } }

        # Compliance (Sumsub)
        - name: SUMSUB_BASE_URL
          value: "https://api.sumsub.com"
        - name: SUMSUB_APP_TOKEN
          valueFrom: { secretKeyRef: { name: stellaro-secrets, key: sumsub-app-token } }
        - name: SUMSUB_SECRET_KEY
          valueFrom: { secretKeyRef: { name: stellaro-secrets, key: sumsub-secret-key } }
        
        # Resource limits (production-grade)
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Startup probe (para boot lento)
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 30
        
        # Volume mounts
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      
      volumes:
      - name: config
        configMap:
          name: stellaro-backend-config

---
apiVersion: v1
kind: Service
metadata:
  name: stellaro-backend-service
  namespace: production
  labels:
    app: stellaro-backend
spec:
  type: LoadBalancer
  selector:
    app: stellaro-backend
  ports:
  - name: http
    protocol: TCP
    port: 443
    targetPort: 3001
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: 9090
  sessionAffinity: ClientIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stellaro-backend-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stellaro-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellaro-backend-sa
  namespace: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/StellaroBackendRole

