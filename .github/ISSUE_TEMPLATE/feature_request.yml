name: Feature request
description: Solicitar uma nova funcionalidade no Stellaro
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Site: https://www.stellaro.com.br/
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qual problema essa feature resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como você imagina a solução?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
