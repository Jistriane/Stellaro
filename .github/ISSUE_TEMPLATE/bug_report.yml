name: Bug report
description: Reportar um bug no Stellaro
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Site: https://www.stellaro.com.br/
  - type: textarea
    id: summary
    attributes:
      label: Resumo
      description: Descreva o problema em uma frase.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Passo a passo para reproduzir.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado atual
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Superfície afetada
      options:
        - Frontend (Web)
        - Backend (API)
        - Mobile
        - Contracts
        - Infra/CI
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: local, staging, mainnet, testnet, etc.
    validations:
      required: true
