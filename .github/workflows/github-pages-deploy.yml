name: Deploy to GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '24'

on:
  push:
    branches: [master, main]
    paths:
      - "apps/frontend/**"
      - "packages/ui/**"
      - ".github/workflows/github-pages-deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci --legacy-peer-deps
        working-directory: ${{ github.workspace }}

      - name: Build with GitHub Pages static export
        env:
          DEPLOY_TARGET: github-pages
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:pages

      - name: Validate exported asset paths
        run: |
          if grep -R -n '"/logo.png"\|"/capa.png"\|"/favicon.ico"\|'"'"'/logo.png'"'"'\|'"'"'/capa.png'"'"'\|'"'"'/favicon.ico'"'"'' out; then
            echo "Found unprefixed public asset paths in exported files."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
