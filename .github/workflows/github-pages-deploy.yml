name: Deploy to GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '20'

on:
  push:
    branches: [master, main]
    paths:
      - "apps/frontend/**"
      - "packages/ui/**"
      - ".github/workflows/github-pages-deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci --legacy-peer-deps
        working-directory: ${{ github.workspace }}

      - name: Build with GitHub Pages static export
        env:
          DEPLOY_TARGET: github-pages
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:pages

      - name: Validate exported asset paths
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const outDir = path.resolve('out');
          const publicDir = path.resolve('public');
          const basePath = process.env.NEXT_PUBLIC_BASE_PATH || '';
          const textExtensions = new Set(['.html', '.js', '.txt', '.json', '.xml', '.map', '.webmanifest']);

          function walk(dir, files = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(fullPath, files);
              } else {
                files.push(fullPath);
              }
            }
            return files;
          }

          const publicAssets = walk(publicDir)
            .map((file) => '/' + path.relative(publicDir, file).split(path.sep).join('/'));

          const offenders = [];
          for (const file of walk(outDir)) {
            if (!textExtensions.has(path.extname(file).toLowerCase())) continue;
            const content = fs.readFileSync(file, 'utf8');

            for (const asset of publicAssets) {
              const unprefixed = new RegExp(`(?<![A-Za-z0-9:])${asset.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'g');
              if (unprefixed.test(content)) {
                offenders.push(`${path.relative(process.cwd(), file)} -> ${asset}`);
                break;
              }
            }
          }

          if (offenders.length > 0) {
            console.error('Found unprefixed public asset paths in exported files:');
            for (const offender of offenders.slice(0, 50)) {
              console.error(` - ${offender}`);
            }
            if (offenders.length > 50) {
              console.error(` - ...and ${offenders.length - 50} more`);
            }
            process.exit(1);
          }

          console.log(`Pages asset path validation passed for basePath ${basePath}.`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
