name: Frontend Deploy (Vercel)

on:
  push:
    branches: [master, main]
    paths:
      - "apps/frontend/**"
      - "packages/ui/**"
      - ".github/workflows/frontend-deploy.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "apps/frontend/**"
      - "packages/ui/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: .

      - name: Pull Vercel Preview Environment
        run: npx vercel pull --yes --environment=preview --token=${VERCEL_TOKEN}

      - name: Build Preview Artifacts
        run: npx vercel build --token=${VERCEL_TOKEN}

      - name: Deploy Preview
        run: npx vercel deploy --prebuilt --token=${VERCEL_TOKEN}

  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: .

      - name: Pull Vercel Production Environment
        run: npx vercel pull --yes --environment=production --token=${VERCEL_TOKEN}

      - name: Build Production Artifacts
        run: npx vercel build --prod --token=${VERCEL_TOKEN}

      - name: Deploy Production
        run: npx vercel deploy --prebuilt --prod --token=${VERCEL_TOKEN}
