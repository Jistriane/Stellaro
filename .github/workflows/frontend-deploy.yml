name: Frontend Deploy (Vercel)

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [master, main]
    paths:
      - "apps/frontend/**"
      - "packages/ui/**"
      - ".github/workflows/frontend-deploy.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "apps/frontend/**"
      - "packages/ui/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: .

      - name: Pull Vercel Preview Environment
        run: npx vercel pull --yes --environment=preview --token=${VERCEL_TOKEN}

      - name: Build Preview Artifacts
        run: npx vercel build --token=${VERCEL_TOKEN}

      - name: Deploy Preview
        id: deploy_preview
        run: |
          PREVIEW_URL=$(npx vercel deploy --prebuilt --token=${VERCEL_TOKEN} | tail -n 1)
          echo "url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Validate Preview URL
        run: |
          if [ -z "${{ steps.deploy_preview.outputs.url }}" ]; then
            echo "Preview URL is empty. Failing workflow to avoid false positive deploy."
            exit 1
          fi

      - name: Comment Preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: frontend-vercel-preview
          message: |
            Frontend Preview Deploy:
            ${{ steps.deploy_preview.outputs.url }}

  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: .

      - name: Pull Vercel Production Environment
        run: npx vercel pull --yes --environment=production --token=${VERCEL_TOKEN}

      - name: Build Production Artifacts
        run: npx vercel build --prod --token=${VERCEL_TOKEN}

      - name: Deploy Production
        run: npx vercel deploy --prebuilt --prod --token=${VERCEL_TOKEN}
