name: Pages Smoke Monitor

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pages-smoke-monitor
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Pages URL
        id: pages_url
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_LOWER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          URL="https://${OWNER_LOWER}.github.io/${REPO_NAME}/"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Wait for propagation
        run: sleep 20

      - name: Check HTTP status
        env:
          TARGET_URL: ${{ steps.pages_url.outputs.url }}
        run: |
          ATTEMPTS=5
          DELAY=8
          STATUS=""

          for attempt in $(seq 1 "${ATTEMPTS}"); do
            STATUS="$(curl -sS -o /tmp/pages.html -w "%{http_code}" "${TARGET_URL}")"
            if [ "${STATUS}" = "200" ]; then
              break
            fi
            echo "Attempt ${attempt}/${ATTEMPTS} failed for ${TARGET_URL} (HTTP ${STATUS})."
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              sleep "${DELAY}"
            fi
          done

          if [ "${STATUS}" != "200" ]; then
            echo "Expected HTTP 200 for ${TARGET_URL}, got ${STATUS} after ${ATTEMPTS} attempts"
            exit 1
          fi

      - name: Validate expected content
        env:
          REPO_NAME: ${{ steps.pages_url.outputs.repo_name }}
        run: |
          grep -q "<title>Stellaro</title>" /tmp/pages.html
          grep -q "/${REPO_NAME}/_next/" /tmp/pages.html
          grep -q "/${REPO_NAME}/logo.png" /tmp/pages.html
          grep -q "/${REPO_NAME}/capa.png" /tmp/pages.html

      - name: Validate static assets
        env:
          TARGET_URL: ${{ steps.pages_url.outputs.url }}
        run: |
          ATTEMPTS=4
          DELAY=6

          for asset in logo.png capa.png favicon.ico; do
            ASSET_URL="${TARGET_URL}${asset}"
            STATUS=""

            for attempt in $(seq 1 "${ATTEMPTS}"); do
              STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "${ASSET_URL}")"
              if [ "${STATUS}" = "200" ]; then
                break
              fi
              echo "Attempt ${attempt}/${ATTEMPTS} failed for ${ASSET_URL} (HTTP ${STATUS})."
              if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
                sleep "${DELAY}"
              fi
            done

            if [ "${STATUS}" != "200" ]; then
              echo "Expected HTTP 200 for ${ASSET_URL}, got ${STATUS} after ${ATTEMPTS} attempts"
              exit 1
            fi
          done

      - name: Validate analytics route (charts page)
        env:
          TARGET_URL: ${{ steps.pages_url.outputs.url }}
          REPO_NAME: ${{ steps.pages_url.outputs.repo_name }}
        run: |
          ANALYTICS_URL="${TARGET_URL}dashboard/analytics/"
          ATTEMPTS=5
          DELAY=8
          STATUS=""

          for attempt in $(seq 1 "${ATTEMPTS}"); do
            STATUS="$(curl -sS -o /tmp/pages-analytics.html -w "%{http_code}" "${ANALYTICS_URL}")"
            if [ "${STATUS}" = "200" ]; then
              break
            fi
            echo "Attempt ${attempt}/${ATTEMPTS} failed for ${ANALYTICS_URL} (HTTP ${STATUS})."
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              sleep "${DELAY}"
            fi
          done

          if [ "${STATUS}" != "200" ]; then
            echo "Expected HTTP 200 for ${ANALYTICS_URL}, got ${STATUS} after ${ATTEMPTS} attempts"
            exit 1
          fi
          grep -q "/${REPO_NAME}/_next/" /tmp/pages-analytics.html

      - name: Report success
        env:
          TARGET_URL: ${{ steps.pages_url.outputs.url }}
        run: echo "Pages smoke check passed for ${TARGET_URL}"
