name: Frontend Tests & Lint

on:
  push:
    branches: [master, main, develop]
    paths:
      - "apps/frontend/**"
      - "packages/ui/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "apps/frontend/**"
      - "packages/ui/**"
      - ".github/workflows/frontend-tests.yml"

env:
  NODE_VERSION: '20'

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci --legacy-peer-deps
        working-directory: ${{ github.workspace }}

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci --legacy-peer-deps
        working-directory: ${{ github.workspace }}

      - name: Build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/.next
          if-no-files-found: warn
          retention-days: 1
