name: Frontend Tests & Lint

on:
  push:
    branches: [master, main, develop]
    paths:
      - "apps/frontend/**"
      - "packages/ui/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "apps/frontend/**"
      - "packages/ui/**"
      - ".github/workflows/frontend-tests.yml"

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/.next
          retention-days: 1
