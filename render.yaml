services:
  - type: web
    name: stellaro-backend
    env: node
    rootDir: apps/backend
    plan: starter
    buildCommand: npm ci && npm run prisma:generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STELLAR_NETWORK
        value: public
      - key: SOROBAN_RPC_URL
        value: https://rpc.ankr.com/stellar_soroban
      - key: HORIZON_URL
        value: https://horizon.stellar.org
      - key: STELLAR_NETWORK_PASSPHRASE
        value: Public Global Stellar Network ; September 2015
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stellaro-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: stellaro-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://stellaro-frontend.onrender.com

  - type: web
    name: stellaro-frontend
    env: node
    rootDir: apps/frontend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_STELLAR_NETWORK
        value: public
      - key: NEXT_PUBLIC_HORIZON_URL
        value: https://horizon.stellar.org
      - key: NEXT_PUBLIC_API_URL
        value: https://stellaro-backend.onrender.com

  - type: redis
    name: stellaro-redis
    plan: starter

databases:
  - name: stellaro-postgres
    plan: starter
