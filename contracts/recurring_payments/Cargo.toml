[package]
name = "recurring_payments"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
vc_registry = { path = "../vc_registry" }

[profile.release]
opt-level = "z"
overflow-checks = true
