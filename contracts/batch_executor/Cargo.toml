[package]
name = "batch_executor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "=26.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
soroban-sdk = { version = "=26.1.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
