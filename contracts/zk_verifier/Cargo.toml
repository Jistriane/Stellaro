[package]
name = "zk_verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.6"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
