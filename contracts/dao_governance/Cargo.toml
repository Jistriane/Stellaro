[package]
name = "dao_governance"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "26.1.0"

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
vc_registry = { path = "../vc_registry" }

[profile.release]
opt-level = "z"
overflow-checks = true
